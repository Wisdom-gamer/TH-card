<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cavlike — 游戏 UI 原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="game-area">
      <!-- 上方玩家 区域 -->
      <div class="player top">
        <div class="avatar-container">
          <div class="avatar-inner">
            <img src="null.png" alt="enemy avatar" class="avatar-img" />
          </div>
          <div class="stats">
            <div class="hp">HP: <span id="enemyhp" data-var="enemyhp"></span></div>
            <div class="mp">MP: <span id="enemymp" data-var="enemymp"></span></div>
          </div>
        </div>

        <div class="hand large-hand">
          <div class="hand-label">卡牌</div>
          <div class="slots">
            <button class="card-slot" type="button" aria-label="card-slot-1"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-2"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-3"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-4"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-5"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-6"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-7"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-8"><img src="null.png" alt="card"/></button>
          </div>
        </div>
      </div>

      <!-- 结束回合 按钮 -->
      <button class="end-turn" type="button">结束回合</button>

      <!-- 下方玩家 区域 -->
      <div class="player bottom">
        <div class="avatar-container">
          <div class="avatar-inner">
            <img src="null.png" alt="player avatar" class="avatar-img" />
          </div>
          <div class="stats">
            <div class="hp">HP: <span id="playerhp" data-var="playerhp"></span></div>
            <div class="mp">MP: <span id="playermp" data-var="playermp"></span></div>
          </div>
        </div>

        <div class="hand large-hand bottom-hand">
          <div class="hand-label">卡牌</div>
          <div class="slots">
            <button class="card-slot" type="button" aria-label="card-slot-b1"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-b2"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-b3"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-b4"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-b5"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-b6"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-b7"><img src="null.png" alt="card"/></button>
            <button class="card-slot" type="button" aria-label="card-slot-b8"><img src="null.png" alt="card"/></button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
