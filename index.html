<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Cavlike — TH cards</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <section
  id="character-select"
  aria-label="角色选择"
  aria-hidden="false"
>
  <button
    id="character-prev"
    class="character-arrow"
    type="button"
    aria-label="上一个角色"
  >
    &#9664;
  </button>

  <div id="character-display">
    <img
      id="character-image"
      src="null.png"
      alt="角色"
    />

    <button
      id="character-name"
      type="button"
      aria-label="选择当前角色"
    >
      正在读取角色……
    </button>
  </div>

  <button
    id="character-next"
    class="character-arrow"
    type="button"
    aria-label="下一个角色"
  >
    &#9654;
  </button>
</section>
    <!--
      战斗场景 UI。
      默认由 CSS 设置为隐藏。

      需要显示时，可以通过 JavaScript 添加 is-active 类：
      document.querySelector(".game-area").classList.add("is-active");
    -->
    <div class="game-area">
      <!-- 敌人区域 -->
      <div class="player top">
        <div class="avatar-container">
          <div class="avatar-inner">
            <img
              src="null.png"
              alt="enemy avatar"
              class="avatar-img"
            />
          </div>

          <div class="stats">
            <div class="hp">
              HP:
              <span
                id="enemyhp"
                data-var="enemyhp"
              ></span>
            </div>

            <div class="mp">
              MP:
              <span
                id="enemymp"
                data-var="enemymp"
              ></span>
            </div>
          </div>
        </div>

        <div class="hand large-hand">
          <div class="hand-label">卡牌</div>

          <div class="slots">
            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-1"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-2"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-3"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-4"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-5"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-6"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-7"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-8"
            >
              <img src="null.png" alt="card" />
            </button>
          </div>
        </div>
      </div>

      <!-- 结束回合按钮 -->
      <button
        class="end-turn"
        type="button"
      >
        结束回合
      </button>

      <!-- 玩家区域 -->
      <div class="player bottom">
        <div class="avatar-container">
          <div class="avatar-inner">
            <img
              src="null.png"
              alt="player avatar"
              class="avatar-img"
            />
          </div>

          <div class="stats">
            <div class="hp">
              HP:
              <span
                id="playerhp"
                data-var="playerhp"
              ></span>
            </div>

            <div class="mp">
              MP:
              <span
                id="playermp"
                data-var="playermp"
              ></span>
            </div>
          </div>
        </div>

        <div class="hand large-hand bottom-hand">
          <div class="hand-label">卡牌</div>

          <div class="slots">
            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-b1"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-b2"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-b3"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-b4"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-b5"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-b6"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-b7"
            >
              <img src="null.png" alt="card" />
            </button>

            <button
              class="card-slot"
              type="button"
              aria-label="card-slot-b8"
            >
              <img src="null.png" alt="card" />
            </button>
          </div>
        </div>
      </div>
    </div>

    <!--
      冒险场景 UI。
      与 game-area 处于相同层级。

      整体使用四个区域：
      左上：cardinfo
      右上：nextcards
      左下：复制的 player top
      右下：playerbag
    -->
    <div id="adventure" aria-hidden="true">
      <!-- 左上卡牌信息区域 -->
      <div
        id="cardinfo"
        aria-label="card information"
      ><div
  id="cardinfo-content"
  aria-live="polite"
></div>
        <!--
          按钮文字默认留空。
          JavaScript 可通过以下方式修改：
          document.querySelector("#cardinfo-button").textContent = "确认";
        -->
        <button
          id="cardinfo-button"
          type="button"
          aria-label="card information action"
        ></button>
      </div>

      <!--
        右上待选卡牌区域。
        容器没有粗硬边框，包含五个可点击卡牌。
      -->
      <div
        id="nextcards"
        class="slots"
        aria-label="next cards"
      >
        <button
          class="card-slot"
          type="button"
          aria-label="next-card-1"
        >
          <img src="null.png" alt="next card 1" />
        </button>

        <button
          class="card-slot"
          type="button"
          aria-label="next-card-2"
        >
          <img src="null.png" alt="next card 2" />
        </button>

        <button
          class="card-slot"
          type="button"
          aria-label="next-card-3"
        >
          <img src="null.png" alt="next card 3" />
        </button>

        <button
          class="card-slot"
          type="button"
          aria-label="next-card-4"
        >
          <img src="null.png" alt="next card 4" />
        </button>

        <button
          class="card-slot"
          type="button"
          aria-label="next-card-5"
        >
          <img src="null.png" alt="next card 5" />
        </button>
      </div>

      <!--
        左下玩家区域。
        内容复制自原来的 player top，但使用独立 ID，
        避免一个页面内出现重复 ID。
      -->
      <div class="player top adventure-player">
        <div class="avatar-container">
          <div class="avatar-inner">
            <img
              id="adventure-character-image"
              src="null.png"
              alt="adventure player avatar"
              class="avatar-img"
            />
          </div>

          <div class="stats">
            <div class="hp">
              HP:
              <span
                id="adventurehp"
                data-var="adventurehp"
              ></span>
            </div>

            <div class="mp">
              MP:
              <span
                id="adventuremp"
                data-var="adventuremp"
              ></span>
            </div>
            <div class="xp">
              XP:
              <span
                id="adventurexp"
                data-var="adventurexp"
              ></span>
            </div>
            <div class="gold">
              Gold:
              <span
                id="adventuregold"
                data-var="adventuregold"
              ></span>
            </div>
          </div>
        </div>


        </div>
<div id="playerbag">
  <div
    id="bagcards"
    class="bag-grid"
    aria-label="bag cards"
  ></div>

  <!-- 右侧栏 -->
  <div id="bag-side">

    <!-- 装备栏 -->
    <div
      id="equip"
      class="bag-grid"
      aria-label="equipment"
    ></div>

    <!-- 背包栏 -->
    <div
      id="bagitem"
      class="bag-grid"
      aria-label="bag items"
    ></div>

  </div>
</div>
    </div>
    <script src="bag.js"></script>
    <script src="cards.js"></script>
    <script src="character.js"></script>
  </body>
</html>
